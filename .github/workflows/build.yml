name: Build PDF

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compile cheatsheet.tex
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cheatsheet.tex

      - name: Upload PDF as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: cheatsheet
          path: cheatsheet.pdf

      - name: Attach PDF to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: cheatsheet.pdf
